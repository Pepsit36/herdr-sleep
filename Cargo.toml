[workspace]
resolver = "2"
members = ["crates/herdr-sleep", "crates/herdr-sleep-ph", "crates/xtask"]

[workspace.package]
# Never edit by hand: the release job computes the version and commits it (ADR 0007).
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Pepsit36/herdr-sleep"
homepage = "https://github.com/Pepsit36/herdr-sleep"
authors = ["Sebastien Duplessy"]

[workspace.dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

# Both binaries are tuned for size: the Placeholder lives for days in every
# sleeping pane and its RSS is the whole point of the project (ADR 0001).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
