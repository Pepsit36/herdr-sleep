id = "pepsit36.herdr-sleep"
name = "Herdr Sleep"
# Never edit by hand: the release job writes the version of each release (ADR 0007).
# 0.0.0 marks an unreleased checkout, which scripts/build.sh builds from source.
version = "0.3.0"
description = "Puts idle coding agents to sleep to free memory and wakes them on demand, keeping their pane, name and session."
min_herdr_version = "0.9.2"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[startup]]
command = ["bin/herdr-sleep", "restore"]

[[startup]]
command = ["bin/herdr-sleep", "watch", "--detach"]

[[events]]
on = "pane.focused"
command = ["bin/herdr-sleep", "event"]

[[events]]
on = "tab.focused"
command = ["bin/herdr-sleep", "event"]

[[events]]
on = "workspace.focused"
command = ["bin/herdr-sleep", "event"]

[[actions]]
id = "sleep"
title = "Sleep this agent"
contexts = ["pane"]
command = ["bin/herdr-sleep", "sleep"]

[[actions]]
id = "wake"
title = "Wake this agent"
contexts = ["pane"]
command = ["bin/herdr-sleep", "wake"]

[[actions]]
id = "sweep"
title = "Sleep idle agents now"
contexts = ["global", "workspace"]
command = ["bin/herdr-sleep", "sweep"]

[[actions]]
id = "status"
title = "Sleep status"
contexts = ["global", "workspace"]
command = ["bin/herdr-sleep", "status"]

[[actions]]
id = "ensure-watcher"
title = "Restart sleep watcher"
contexts = ["global"]
command = ["bin/herdr-sleep", "ensure-watcher"]
